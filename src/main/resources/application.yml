server:
  port: 8080            # 后端端口, 前端以后调 http://localhost:8080

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/student_performance?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: root
    # 默认值方便本地直接跑; 换环境时用环境变量 DB_PASSWORD 覆盖即可
    # (IDEA: Run -> Edit Configurations -> Environment variables 里加 DB_PASSWORD=你的密码)
    password: "${DB_PASSWORD:123456}"
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  configuration:
    # 控制台打印实际执行的 SQL, 学习调试很有用
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    # 下划线列名 -> 驼峰属性: student_key -> studentKey
    map-underscore-to-camel-case: true
